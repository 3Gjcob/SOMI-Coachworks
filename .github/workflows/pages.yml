name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gallant-carson-x1tesx, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare site for the Pages subpath
        run: python3 scripts/build-pages.py --base "/${{ github.event.repository.name }}" --origin "https://${GITHUB_REPOSITORY_OWNER,,}.github.io" --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the published site
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Pages settings:"
          gh api "repos/${{ github.repository }}/pages" --jq '{html_url, cname, custom_404, https_enforced, build_type}' || true
          url="https://${PAGE_URL#*://}"
          for i in 1 2 3 4 5 6; do
            echo "Request $i: $url"
            curl -sS -o /dev/null -D - "$url" | grep -iE '^(HTTP|location)' || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = 200 ]; then
              curl -sS "$url" | grep -o '<title>[^<]*</title>'
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url did not return 200 (last status $code); see redirect above"
          exit 1
