name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gallant-carson-x1tesx, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare site for the Pages subpath
        run: python3 scripts/build-pages.py --base "/${{ github.event.repository.name }}" --origin "https://${GITHUB_REPOSITORY_OWNER,,}.github.io" --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
